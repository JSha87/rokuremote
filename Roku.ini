[Rainmeter]
Update=1000
AccurateText=1

[Variables]
; --- Device ---
rokuIPAddress=192.168.6.245

; --- Layout Constants ---
Scale=1
BgOffset=2
ContentWidth=220
CenterAlign=(#ContentWidth# / 2)
ContentMarginFormula=25
RightAlign=(#ContentWidth# - 25)
RowSpacing=15
TopMarginFormula=45

; --- Professional Palette ---
FontFamily=Segoe UI
colorTitle=160,100,255
colorTitleAlpha=255
colorInactiveButton=230,230,230
colorInactiveButtonAlpha=200
hoverAlpha=255

; --- Glass Morphic Background ---
BgShapeX=0
BgShapeY=0
BgShapeW=#ContentWidth#
BgTopColor=75,35,120
BgTopOpacity=255
BgBodyColor=18,18,22
BgBodyOpacity=255
CornerRadius=15
Stroke_Width=1
StrokeColor=255,255,255
StrokeColorAlpha=30

; --- Resources ---
@include=#@#Styles.inc

[MeasureSettingsScript]
Measure=Script
ScriptFile=#@#Settings.lua

; --- Background Height ---
[MeterBackgroundHeight]
Meter=String
Y=380
Text=""

[MeterBackground]
Meter=Shape
MeterStyle=styleBackground

; --- Title ---
[MeterTitle]
Meter=String
MeterStyle=styleTitle
FontSize=9
FontWeight=700
InlineSetting=CharacterSpacing | 3 | 3
Text="R O K U"

; ==================================================
; POWER ROW
; ==================================================
[MeterPowerOn]
Meter=String
MeterStyle=styleButton | StyleLeftAlign | styleStringButtonHover
FontColor=0,255,200
Text="ON"
Y=45
LeftMouseUpAction=["curl" --silent -d "" "http://#rokuIPAddress#:8060/keypress/PowerOn"]

[MeterPowerOff]
Meter=String
MeterStyle=styleButton | StyleRightAlign | styleStringButtonHover
FontColor=255,80,80
Text="OFF"
Y=45
LeftMouseUpAction=["curl" --silent -d "" "http://#rokuIPAddress#:8060/keypress/PowerOff"]

[MeterDiv1]
Meter=Image
MeterStyle=styleHorizontalLine
W=(#ContentWidth# - (#ContentMarginFormula# * 2))
Y=75

; ==================================================
; DIAMOND D-PAD (Hex codes used to prevent garbling)
; ==================================================
[MeterNavUp]
Meter=String
MeterStyle=styleButton | StyleCenterAlign | styleStringButtonHover
Text=[\x25B2]
Y=95
LeftMouseUpAction=["curl" --silent -d "" "http://#rokuIPAddress#:8060/keypress/Up"]

[MeterNavLeft]
Meter=String
MeterStyle=styleButton | StyleLeftAlign | styleStringButtonHover
Text=[\x25C0]
Y=130
LeftMouseUpAction=["curl" --silent -d "" "http://#rokuIPAddress#:8060/keypress/Left"]

[MeterNavSelect]
Meter=String
MeterStyle=styleButton | StyleCenterAlign | styleStringButtonHover
Text="OK"
FontColor=#colorTitle#
FontSize=11
Y=130
LeftMouseUpAction=["curl" --silent -d "" "http://#rokuIPAddress#:8060/keypress/Select"]

[MeterNavRight]
Meter=String
MeterStyle=styleButton | StyleRightAlign | styleStringButtonHover
Text=[\x25B6]
Y=130
LeftMouseUpAction=["curl" --silent -d "" "http://#rokuIPAddress#:8060/keypress/Right"]

[MeterNavDown]
Meter=String
MeterStyle=styleButton | StyleCenterAlign | styleStringButtonHover
Text=[\x25BC]
Y=165
LeftMouseUpAction=["curl" --silent -d "" "http://#rokuIPAddress#:8060/keypress/Down"]

[MeterDiv2]
Meter=Image
MeterStyle=styleHorizontalLine
W=(#ContentWidth# - (#ContentMarginFormula# * 2))
Y=200

; ==================================================
; UTILITY & VOLUME
; ==================================================
[MeterHome]
Meter=String
MeterStyle=styleButton | StyleLeftAlign | styleStringButtonHover
Text="HOME"
FontSize=9
Y=220
LeftMouseUpAction=["curl" --silent -d "" "http://#rokuIPAddress#:8060/keypress/Home"]

[MeterBack]
Meter=String
MeterStyle=styleButton | StyleRightAlign | styleStringButtonHover
Text="BACK"
FontSize=9
Y=220
LeftMouseUpAction=["curl" --silent -d "" "http://#rokuIPAddress#:8060/keypress/Back"]

[MeterVolDown]
Meter=String
MeterStyle=styleButton | StyleLeftAlign | styleStringButtonHover
Text="VOL -"
Y=255
LeftMouseUpAction=["curl" --silent -d "" "http://#rokuIPAddress#:8060/keypress/VolumeDown"]

[MeterVolUp]
Meter=String
MeterStyle=styleButton | StyleRightAlign | styleStringButtonHover
Text="VOL +"
Y=255
LeftMouseUpAction=["curl" --silent -d "" "http://#rokuIPAddress#:8060/keypress/VolumeUp"]

[MeterDiv3]
Meter=Image
MeterStyle=styleHorizontalLine
W=(#ContentWidth# - (#ContentMarginFormula# * 2))
Y=290

; ==================================================
; APPS
; ==================================================
[MeterLaunchPrime]
Meter=String
MeterStyle=styleButton | StyleLeftAlign | styleStringButtonHover
Text="PRIME"
FontSize=9
FontColor=0,168,225
Y=310
LeftMouseUpAction=["curl" --silent -d "" "http://#rokuIPAddress#:8060/launch/13"]

[MeterLaunchPlaylet]
Meter=String
MeterStyle=styleButton | StyleRightAlign | styleStringButtonHover
Text="PLAYLET"
FontSize=9
FontColor=255,100,100
Y=310
LeftMouseUpAction=["curl" --silent -d "" "http://#rokuIPAddress#:8060/launch/693751"]
